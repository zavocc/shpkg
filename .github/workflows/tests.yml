name: Automated Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:


jobs:
  testing:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    env:
      TERM: "xterm-256color"
      SHPKG_FORCE_ASSUME_YES: "1"
    steps:
      - uses: actions/checkout@v2
      - name: Setup buildscripts
        run: |
          #. ./install.sh
          #./shpkg update
          mkdir -p ${HOME}/.shpkg
          mv samples/hello-world ${HOME}/.shpkg

      - name: Installation Tests
        run: |
          yes | ./shpkg install hello-world

      - name: Execution Tests
        run: |
          if [ ! -f /usr/local/bin/shpkg-hello ]; then
            echo "Installation isn't successful!"
            exit 2
          fi

          if ! shpkg-hello !>/dev/null 2>&1; then
            echo "Installation isn't successful!"
            exit 2
          fi

          shpkg-hello

      - name: Uninstallation Tests
        run: |
          yes | ./shpkg uninstall hello-world
