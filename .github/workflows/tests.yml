name: Automated Tests


on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:


jobs:
  testing:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    env:
      TERM: "xterm-256color"
    steps:
      - uses: actions/checkout@v2
      - name: Clone ports repository
        run: |
          git clone https://github.com/shpkg/ports ${HOME}/.shpkg

      - name: Installation Tests
        run: |
          bash -x ./shpkg install hello-world
          
      - name: Execution Tests
        run: |
          for exec in /opt/shpkg/hello-world/bin/shpkg-hello /usr/local/bin/shpkg-hello; do
            if [ ! -f ${exec} ]; then
              echo "Installation isn't successful!"
              exit 2
            fi
          done
          
          if ! shpkg-hello >/dev/null 2>&1; then
            echo "Installation isn't successful!"
            exit 2
          fi
      
      - name: Uninstallation Tests
        run: |
          yes | ./shpkg uninstall hello-world
