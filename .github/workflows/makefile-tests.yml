name: Makefile validation

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:


jobs:
  testing:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    env:
      TERM: "xterm-256color"
    steps:
      - uses: actions/checkout@v2
      - name: make install tests
        run: |
          sudo make install

          if [ ! -e /usr/local/bin/shpkg ]; then
            echo "make install failed!"
            exit 2
          fi

      - name: make uninstall tests
        run: |
          sudo make uninstall

          if [ -e /usr/local/bin/shpkg ]; then
            echo "make uninstall failed!"
            exit 2
          fi
